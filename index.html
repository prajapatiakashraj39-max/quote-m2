<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #222;
            margin-bottom: 30px;
        }

        #quote {
            font-size: 24px;
            line-height: 1.5;
            color: #333;
            margin-bottom: 15px;
        }

        #author {
            font-size: 18px;
            color: #666;
            font-style: italic;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Random Quote Generator</h1>

        <p id="quote">Click the button to get a quote.</p>
        <p id="author"></p>

        <button id="quoteBtn">New Quote</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
